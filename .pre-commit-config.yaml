# Install once:  pip install pre-commit && pre-commit install
# Hooks run only on files you stage. Result files (csv, log, mat, matlab/) are excluded
# so formatters never touch experiment outputs.
exclude: '(^matlab/|\.csv$|\.log$|\.mat$)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix"]

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
